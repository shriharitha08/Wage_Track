<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance | WageTrack</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">WageTrack</div>

    <div class="nav-links">

        <a href="/dashboard">Dashboard</a>
        <a href="/workers">Workers</a>
        <a href="/worksites">Worksites</a>
        <a href="/attendance">Attendance</a>
        <a href="/wages">Wages</a>
        <a href="/payments">Payments</a>

    </div>

</nav>


<div class="container">

    <div class="page-header">

        <div>

            <h1>Attendance</h1>

            <p>
                Mark and manage daily worker attendance.
            </p>

        </div>

        <button class="btn"
                onclick="openAddForm()">

            + Mark Attendance

        </button>

    </div>


    <!-- FORM -->

    <div id="attendanceForm"
         class="form-card"
         style="display:none;">

        <h2 id="formTitle">
            Mark Attendance
        </h2>

        <input type="hidden"
               id="attendanceId">


        <div class="form-group">

            <label>Worker</label>

            <select id="workerId">

                <option value="">
                    Select Worker
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Worksite</label>

            <select id="worksiteId">

                <option value="">
                    Select Worksite
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Date</label>

            <input type="date"
                   id="attendanceDate">

        </div>


        <div class="form-group">

            <label>Attendance Type</label>

            <select id="attendanceType">

                <option value="FULL_DAY">
                    Full Day
                </option>

                <option value="HALF_DAY">
                    Half Day
                </option>

                <option value="ABSENT">
                    Absent
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Worked Hours</label>

            <input type="number"
                   id="workedHours"
                   value="8"
                   min="0"
                   step="0.5">

        </div>


        <button class="btn"
                onclick="saveAttendance()">

            Save Attendance

        </button>

        <button class="btn secondary"
                onclick="closeForm()">

            Cancel

        </button>

    </div>


    <br>


    <!-- TABLE -->

    <div class="table-card">

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Date</th>
                <th>Worker</th>
                <th>Worksite</th>
                <th>Status</th>
                <th>Hours</th>
                <th>OT Hours</th>
                <th>OT Pay</th>
                <th>Daily Pay</th>
                <th>Actions</th>

            </tr>

            </thead>

            <tbody id="attendanceTable">

            </tbody>

        </table>

    </div>

</div>


<script>

let attendanceRecords = [];

let workers = [];

let worksites = [];

let editMode = false;


/* -------------------------
   OPEN ADD FORM
------------------------- */

function openAddForm() {

    editMode = false;

    document.getElementById("formTitle")
        .innerText = "Mark Attendance";

    document.getElementById("attendanceForm")
        .style.display = "block";

    clearForm();

}


/* -------------------------
   CLOSE FORM
------------------------- */

function closeForm() {

    document.getElementById("attendanceForm")
        .style.display = "none";

}


/* -------------------------
   CLEAR FORM
------------------------- */

function clearForm() {

    document.getElementById("attendanceId")
        .value = "";

    document.getElementById("workerId")
        .value = "";

    document.getElementById("worksiteId")
        .value = "";

    document.getElementById("attendanceDate")
        .value = new Date()
        .toISOString()
        .split("T")[0];

    document.getElementById("attendanceType")
        .value = "FULL_DAY";

    document.getElementById("workedHours")
        .value = "8";

}


/* -------------------------
   LOAD WORKERS
------------------------- */

async function loadWorkers() {

    try {

        const response =
            await fetch("/api/workers");

        if (!response.ok) {
            throw new Error("Worker API failed");
        }

        workers =
            await response.json();

        const select =
            document.getElementById("workerId");

        select.innerHTML =
            '<option value="">Select Worker</option>';

        workers.forEach(worker => {

            select.innerHTML +=
                `<option value="${worker.id}">
                    ${worker.name}
                </option>`;

        });

    } catch (error) {

        console.error(error);

        alert(
            "Unable to load workers. Please check Worker API."
        );

    }

}


/* -------------------------
   LOAD WORKSITES
------------------------- */

async function loadWorksites() {

    try {

        const response =
            await fetch("/api/worksites");

        if (!response.ok) {
            throw new Error("Worksite API failed");
        }

        worksites =
            await response.json();

        const select =
            document.getElementById("worksiteId");

        select.innerHTML =
            '<option value="">Select Worksite</option>';

        worksites.forEach(site => {

            select.innerHTML +=
                `<option value="${site.id}">
                    ${site.siteName}
                </option>`;

        });

    } catch (error) {

        console.error(error);

        alert(
            "Unable to load worksites. Please check Worksite API."
        );

    }

}


/* -------------------------
   LOAD ATTENDANCE
------------------------- */

async function loadAttendance() {

    try {

        const response =
            await fetch("/api/attendance");

        if (!response.ok) {
            throw new Error("Attendance API failed");
        }

        attendanceRecords =
            await response.json();

        displayAttendance();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to load attendance records."
        );

    }

}


/* -------------------------
   DISPLAY ATTENDANCE
------------------------- */

function displayAttendance() {

    const table =
        document.getElementById("attendanceTable");

    table.innerHTML = "";


    attendanceRecords.forEach(record => {

        const worker =
            workers.find(
                w => w.id ===
                    (record.worker
                        ? record.worker.id
                        : null)
            );

        const site =
            worksites.find(
                s => s.id ===
                    (record.worksite
                        ? record.worksite.id
                        : null)
            );


        const workerName =
            worker
                ? worker.name
                : "Worker #" +
                  (record.worker
                      ? record.worker.id
                      : "-");


        const siteName =
            site
                ? site.siteName
                : "Site #" +
                  (record.worksite
                      ? record.worksite.id
                      : "-");


        table.innerHTML += `

        <tr>

            <td>${record.id}</td>

            <td>${record.attendanceDate}</td>

            <td>${workerName}</td>

            <td>${siteName}</td>

            <td>${record.attendanceType}</td>

            <td>${record.workedHours}</td>

            <td>${record.overtimeHours}</td>

            <td>₹${record.overtimePay}</td>

            <td>₹${record.dailyPay}</td>

            <td>

                <button
                    class="small-btn"
                    onclick="editAttendance(${record.id})">

                    Edit

                </button>

                <button
                    class="small-btn danger"
                    onclick="deleteAttendance(${record.id})">

                    Delete

                </button>

            </td>

        </tr>

        `;

    });

}


/* -------------------------
   SAVE
------------------------- */

async function saveAttendance() {

    const workerId =
        document.getElementById("workerId")
            .value;

    const worksiteId =
        document.getElementById("worksiteId")
            .value;

    const date =
        document.getElementById("attendanceDate")
            .value;

    const type =
        document.getElementById("attendanceType")
            .value;

    const hours =
        Number(
            document.getElementById("workedHours")
                .value
        );


    if (!workerId) {

        alert("Please select a worker.");

        return;

    }


    if (!worksiteId) {

        alert("Please select a worksite.");

        return;

    }


    if (!date) {

        alert("Please select a date.");

        return;

    }


    const attendance = {

        attendanceDate: date,

        attendanceType: type,

        workedHours: hours

    };


    try {

        let response;


        /* EDIT */

        if (editMode) {

            const id =
                document.getElementById("attendanceId")
                    .value;

            response =
                await fetch(
                    `/api/attendance/${id}`,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(attendance)

                    }
                );

        }

        /* ADD */

        else {

            response =
                await fetch(
                    `/api/attendance?workerId=${workerId}&worksiteId=${worksiteId}`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(attendance)

                    }
                );

        }


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(errorText);

            alert(
                "Unable to save attendance."
            );

            return;

        }


        alert(
            editMode
                ? "Attendance updated successfully."
                : "Attendance saved successfully."
        );


        closeForm();

        await loadAttendance();

    } catch (error) {

        console.error(error);

        alert(
            "Server error. Check Spring Boot console."
        );

    }

}


/* -------------------------
   EDIT
------------------------- */

function editAttendance(id) {

    const record =
        attendanceRecords.find(
            item => item.id === id
        );


    if (!record) {

        alert("Attendance record not found.");

        return;

    }


    editMode = true;


    document.getElementById("formTitle")
        .innerText = "Edit Attendance";


    document.getElementById("attendanceForm")
        .style.display = "block";


    document.getElementById("attendanceId")
        .value = record.id;


    document.getElementById("workerId")
        .value =
            record.worker
                ? record.worker.id
                : "";


    document.getElementById("worksiteId")
        .value =
            record.worksite
                ? record.worksite.id
                : "";


    document.getElementById("attendanceDate")
        .value =
            record.attendanceDate;


    document.getElementById("attendanceType")
        .value =
            record.attendanceType;


    document.getElementById("workedHours")
        .value =
            record.workedHours;

}


/* -------------------------
   DELETE
------------------------- */

async function deleteAttendance(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this attendance?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/attendance/${id}`,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            alert(
                "Unable to delete attendance."
            );

            return;

        }


        alert(
            "Attendance deleted successfully."
        );


        await loadAttendance();

    } catch (error) {

        console.error(error);

        alert(
            "Server error while deleting."
        );

    }

}


/* -------------------------
   INITIAL LOAD
------------------------- */

async function initializePage() {

    await loadWorkers();

    await loadWorksites();

    await loadAttendance();

}


initializePage();

</script>

</body>

</html>
